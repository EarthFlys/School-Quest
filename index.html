<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="School Quest">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>School Quest · ม.6/12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-animation"></div>
<div class="bg-glow"></div>
<div class="bg-glow g2"></div>

<!-- ========== หน้าล็อกอิน / สมัครสมาชิก ========== -->
<section class="auth hidden" id="auth">
  <div class="auth-box box pop">
    <div class="logo">🎒</div>
    <h1 class="pixel-title">SCHOOL<br><span>QUEST</span></h1>
    <p class="blink">▶ PRESS START</p>
    <div class="auth-tabs">
      <button type="button" class="active" data-mode="login">เข้าสู่ระบบ</button>
      <button type="button" data-mode="register">สมัครใหม่</button>
    </div>
    <form id="authForm" autocomplete="off">
      <div class="only-register reg-fields">
        <label>ชื่อที่ให้เรียก <input name="name" placeholder="เช่น ต้น"></label>
        <label>ห้องเรียน <input name="room" placeholder="เช่น ม.6/12" value="ม.6/12"></label>
        <label>เลือกรูปโปรไฟล์ของคุณ</label>
        <div class="avatar-picker" id="avatarPicker">
          <span class="sel" data-av="🐱">🐱</span>
          <span data-av="🦊">🦊</span>
          <span data-av="🐼">🐼</span>
          <span data-av="🦄">🦄</span>
          <span data-av="🤖">🤖</span>
          <span data-av="🚀">🚀</span>
        </div>
      </div>
      <label>ชื่อผู้ใช้ 
  <input name="username" required autocomplete="off" autocapitalize="off" autocorrect="off" data-lpignore="true" spellcheck="false" placeholder="username (ถ้าเป็นหัวหน้า ใส่ชื่อเฉพาะ)">
</label>
      <label>รหัสผ่าน <input name="password" type="password" required minlength="4" autocapitalize="off" autocorrect="off" placeholder="รหัสผ่าน"></label>
      <button class="btn primary" type="submit">START ▶</button>
      <p class="auth-msg" id="authMsg"></p>
    </form>
  </div>
</section>

<!-- ========== ตัวแอปหลัก ========== -->
<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="brand"><span>🎒</span><b>SCHOOL<br><em>QUEST</em></b></div>
    <div class="profile box">
      <div class="avatar" id="avatarDisplay">🐱</div>
      <div style="min-width:0">
        <b id="sideName">ชื่อผู้ใช้</b>
        <small id="sideRoom">ม.6/12</small>
      </div>
    </div>
    <nav class="nav">
      <button data-act="page" data-page="home" class="active"><span>🏠</span><em>หน้าหลัก</em></button>
      <button data-act="page" data-page="timetable"><span>📅</span><em>ตารางเรียน</em></button>
      <button data-act="page" data-page="quests"><span>⚔️</span><em>เควสห้องเรียน</em><i id="badge"></i></button>
      <button data-act="page" data-page="activities"><span>🎪</span><em>กิจกรรมห้อง</em></button>
      <button data-act="page" data-page="calendar"><span>🗓️</span><em>ปฏิทิน</em></button>
      <button data-act="page" data-page="members"><span>👥</span><em>สมาชิก</em></button>
    </nav>
    <div class="side-foot">
      <button class="btn sm" data-act="theme" title="สลับโหมด">🌓</button>
      <button class="btn sm" data-act="logout" title="ออกจากระบบ">🚪 ออก</button>
    </div>
  </aside>
  <main class="main">
    <section class="page active" id="page-home"></section>
    <section class="page" id="page-timetable"></section>
    <section class="page" id="page-quests"></section>
    <section class="page" id="page-activities"></section>
    <section class="page" id="page-calendar"></section>
    <section class="page" id="page-members"></section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="modal-backdrop" data-act="close"></div>
  <div class="modal-content">

    <!-- ฟอร์มเพิ่มเควส (สำหรับหัวหน้า) -->
    <form class="modal-box box" id="questForm" autocomplete="off">
      <button type="button" class="close-btn" data-act="close" aria-label="ปิด">✕</button>
      <input type="hidden" name="id">
      <h2 id="questFormTitle">⚔️ มอบหมายเควสให้ห้อง</h2>
      <label>ชื่อเควส / การบ้าน <input name="title" required placeholder="เช่น ทำแบบฝึกหัด หน้า 50"></label>
      <div class="row">
        <label>คุณครู <select name="teacher" id="teacherSelect"></select></label>
        <label>ประเภท
          <select name="type">
            <option value="การบ้าน">การบ้าน</option>
            <option value="งานกลุ่ม">งานกลุ่ม</option>
            <option value="สอบย่อย">สอบย่อย</option>
            <option value="อื่นๆ">อื่นๆ</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>กำหนดส่ง <input name="due" type="date" required></label>
        <label>ระดับความยาก
          <select name="diff">
            <option value="easy">⭐ ง่าย (+10 XP)</option>
            <option value="normal" selected>⭐⭐ ปานกลาง (+20 XP)</option>
            <option value="hard">⭐⭐⭐ ยาก (+40 XP)</option>
          </select>
        </label>
      </div>
      <label>รายละเอียดเพิ่มเติม <textarea name="note" rows="2" placeholder="เช่น ทำข้อคู่ทั้งหมด ส่งในคาบ"></textarea></label>
      <div class="row">
        <button type="button" class="btn" data-act="close">ยกเลิก</button>
        <button type="submit" class="btn primary" id="questSubmit">ประกาศให้ทั้งห้อง</button>
      </div>
    </form>

    <!-- ฟอร์มเพิ่มกิจกรรมห้อง -->
    <form class="modal-box box" id="actForm" autocomplete="off">
      <button type="button" class="close-btn" data-act="close" aria-label="ปิด">✕</button>
      <h2>🎪 เพิ่มกิจกรรมห้องเรียน</h2>
      <label>ชื่องาน / กิจกรรม <input name="title" required placeholder="เช่น ซ้อมกีฬาสี / ทำความสะอาดห้อง"></label>
      <div class="row">
        <label>วันที่จัด <input name="date" type="date" required></label>
        <label>ผู้รับผิดชอบ <input name="assignee" placeholder="เช่น เวรทำความสะอาดกลุ่ม 1"></label>
      </div>
      <label>รายละเอียด <textarea name="description" rows="2" placeholder="รายละเอียดเพิ่มเติมของกิจกรรม"></textarea></label>
      <div class="row">
        <button type="button" class="btn" data-act="close">ยกเลิก</button>
        <button type="submit" class="btn primary">บันทึกกิจกรรม</button>
      </div>
    </form>

  </div>
</div>

<div class="levelup" id="levelup"><div id="luText">LEVEL UP!</div></div>
<div class="toast box" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
